<body>
  <main class="page" aria-label="Welcome！">
    <div class="frame">
      <header class="top-nav">
        <div class="nav-actions">
          <button class="nav-icon" id="open-search" aria-label="Search the archive" data-web-anchor><svg viewBox="0 0 26 26" fill="none" aria-hidden="true"><circle cx="10.9" cy="10.9" r="7.6" stroke="currentColor" stroke-width="1.6"/><path d="m16.7 16.7 6 6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
          <button class="nav-icon" id="open-menu" aria-label="Open menu" aria-expanded="false" aria-controls="cabinet-drawer" data-web-anchor><svg viewBox="0 0 26 26" fill="none" aria-hidden="true"><path d="M3 8h20M3 18h20" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
        </div>
      </header>
      <h1 class="found" data-web-anchor aria-label="Welcome！"><span>Welc</span><span class="letter-o">o</span><span>me</span><span class="exclamation">！</span></h1>
      <img class="object mug" id="object-mug" data-web-anchor src="{{MUG}}" width="241" height="220" alt="A ceramic mug with Main Character written on it" draggable="false">
      <img class="object book" id="object-book" data-web-anchor src="{{BOOK}}" width="293" height="322" alt="A pink book and an iPod in a transparent glass sleeve" draggable="false">
      {{COLLECTION}}
    </div>
    <canvas id="web-canvas" class="web-layer" aria-hidden="true"></canvas>
    <div class="over" aria-hidden="true"><div class="found"><span>Welc</span><span class="letter-o">o</span><span>me</span><span class="exclamation">！</span></div></div>
    <div class="theme-switcher" role="group" aria-label="切换主题" data-no-spider>
      <button class="theme-button" type="button" data-theme-choice="silver" aria-label="切换到银色主题" aria-pressed="false" title="银色主题"></button>
      <button class="theme-button" type="button" data-theme-choice="rose" aria-label="切换到粉黑渐变主题" aria-pressed="false" title="粉黑渐变主题"></button>
      <button class="theme-button" type="button" data-theme-choice="blue" aria-label="切换到蓝色织物主题" aria-pressed="false" title="蓝色织物主题"></button>
    </div>
  </main>

    <h2 id="drawer-title" class="sr-only">Archive</h2><div id="drawer-content"></div>
  </dialog>
  <script>window.FOUND_ASSETS={spider:'{{SPIDER}}',idle:'{{IDLE}}',fly:'{{FLY}}'};</script>
  <script>{{UI_JS}}</script>
  <script>{{SILK_JS}}</script>
  <script>{{SPIDER_JS}}</script>
</body>
</html>
